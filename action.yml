name: "Self-Correcting Code Review & Architectural Audit Agent"
description: "Autonomous code review, AST static analysis (Ruff, Mypy, Pytest), and self-correcting fixes via Google Gemini."
author: "Google DeepMind Advanced Agentic Coding"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  llm_provider:
    description: "LLM Provider to use ('gemini', 'openai', 'anthropic', 'groq', 'custom', 'ollama'). Default: 'gemini'."
    required: false
    default: "gemini"
  llm_model:
    description: "Model name (e.g. 'gpt-4o-mini', 'claude-3-5-haiku-20241022', 'gemini-2.5-flash'). Defaults to provider best budget model."
    required: false
    default: ""
  llm_api_key:
    description: "API key for the selected provider."
    required: false
    default: ""
  gemini_api_key:
    description: "Google Gemini API key."
    required: false
    default: ""
  openai_api_key:
    description: "OpenAI API key."
    required: false
    default: ""
  anthropic_api_key:
    description: "Anthropic Claude API key."
    required: false
    default: ""
  groq_api_key:
    description: "Groq API key."
    required: false
    default: ""
  llm_base_url:
    description: "Custom base URL for OpenAI-compatible or local model endpoints."
    required: false
    default: ""
  pinecone_api_key:
    description: "Pinecone API key for serverless vector store (optional)."
    required: false
    default: ""
  pinecone_index_name:
    description: "Pinecone index name (default: codebase-symbols)."
    required: false
    default: "codebase-symbols"
  pinecone_cloud:
    description: "Pinecone serverless cloud provider (default: aws)."
    required: false
    default: "aws"
  pinecone_region:
    description: "Pinecone serverless cloud region (default: us-east-1)."
    required: false
    default: "us-east-1"
  github_token:
    description: "GitHub token for commenting and PR reviews (defaults to automatic GitHub Actions token)."
    required: false
    default: ${{ github.token }}
  path:
    description: "Repository path or directory to audit."
    required: false
    default: "."
  auto_approve:
    description: "Whether to automatically approve and commit verified patches."
    required: false
    default: "true"
  max_retries:
    description: "Maximum number of self-correction loop iterations."
    required: false
    default: "3"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Agent Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ github.action_path }}/requirements.txt"
        pip install "${{ github.action_path }}"

    - name: Execute Self-Correcting Code Review Agent
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        LLM_PROVIDER: ${{ inputs.llm_provider }}
        LLM_MODEL: ${{ inputs.llm_model }}
        LLM_API_KEY: ${{ inputs.llm_api_key }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GROQ_API_KEY: ${{ inputs.groq_api_key }}
        LLM_BASE_URL: ${{ inputs.llm_base_url }}
        PINECONE_API_KEY: ${{ inputs.pinecone_api_key }}
        PINECONE_INDEX_NAME: ${{ inputs.pinecone_index_name }}
        PINECONE_CLOUD: ${{ inputs.pinecone_cloud }}
        PINECONE_REGION: ${{ inputs.pinecone_region }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MAX_RETRIES: ${{ inputs.max_retries }}
      run: |
        AUTO_APPROVE_FLAG=""
        if [ "${{ inputs.auto_approve }}" = "true" ]; then
          AUTO_APPROVE_FLAG="--auto-approve"
        fi
        python -m code_review_agent.cli audit --path "${{ inputs.path }}" $AUTO_APPROVE_FLAG
